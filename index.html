<!DOCTYPE html>
<html lang="es">
<head>
<script src="config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmacia Barceló | Pantalla</title>
<style>
:root{--green:#A895C6;--mint:#F5F1ED;--ink:#8871AA;--cream:#fbfcf8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:Montserrat,Helvetica,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column}
header{height:12vh;min-height:78px;background:var(--green);color:#FBF9F6;display:flex;align-items:center;justify-content:space-between;padding:0 3.2vw;gap:2vw}
.brand{font-size:clamp(25px,3vw,48px);font-weight:800;letter-spacing:.04em}.links{font-size:clamp(13px,1.4vw,22px);text-align:right;line-height:1.5}.links a{color:#F5F1ED;text-decoration:none}
main{height:88vh;padding:2.1vh 2vw;display:grid;grid-template-columns:1.65fr 1fr;gap:1.5vw}
.panel{background:#FBF9F6;border:1px solid #F5F1ED;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #F5F1ED;min-height:0}
.video-panel{display:flex;flex-direction:column}.section-title{background:var(--mint);padding:1.2vh 1.2vw;font-size:clamp(17px,1.6vw,26px);font-weight:700;color:var(--green)}
.video-stage{flex:1;min-height:0;background:#81788B;display:flex;align-items:center;justify-content:center;position:relative}
.video-stage iframe{width:100%;height:100%;border:0}.video-stage .empty{color:#FBF9F6;text-align:center;padding:30px;font-size:clamp(18px,2vw,30px)}
.side{display:grid;grid-template-rows:1fr 1fr;gap:1.5vh;min-height:0}.carousel-panel{display:flex;flex-direction:column;min-height:0}
.carousel-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#F5F1ED}
.carousel-stage img{width:100%;height:100%;object-fit:contain;padding:1vh 1vw}
.caption{position:absolute;bottom:0;left:0;right:0;background:#C2B2D8;color:#FBF9F6;padding:10px 14px;font-size:clamp(12px,1.2vw,18px);text-align:center}
.empty-side{padding:20px;text-align:center;color:#78619B;font-size:clamp(14px,1.3vw,20px)}
@media(max-aspect-ratio:4/3){main{grid-template-columns:1.3fr 1fr}.brand{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="brand">FARMACIA BARCELÓ</div>
  <div class="links"><a id="instagram" href="https://www.instagram.com/farmaciabarcelomadrid" target="_blank">Instagram:@farmaciabarcelomadrid</a><br><a id="website" href="https://farmaciabarcelo.es" target="_blank">farmaciabarcelo.es</a></div>
</header>
<main>
  <section class="panel video-panel">
    <div class="section-title">Vídeos de salud y farmacia</div>
    <div class="video-stage" id="videoStage"><div class="empty">Los vídeos aparecerán aquí</div></div>
  </section>
  <div class="side">
    <section class="panel carousel-panel">
      <div class="section-title">Novedades</div>
      <div class="carousel-stage" id="newsStage"><div class="empty-side">Las imágenes de novedades aparecerán aquí</div></div>
    </section>
    <section class="panel carousel-panel">
      <div class="section-title">Promociones y productos destacados</div>
      <div class="carousel-stage" id="promoStage"><div class="empty-side">Las imágenes de promociones aparecerán aquí</div></div>
    </section>
  </div>
</main>
<script>
/*
CONFIGURACIÓN:
1) Crea una API key de Google Drive API (Google Cloud) y pégala abajo.
2) Pega el ID de cada carpeta de Drive. ID = texto entre /folders/ y el siguiente ? de su URL.
3) Comparte las carpetas como "Cualquier persona con el enlace – Lector".
4) Añade vídeos MP4 y fotos JPG/PNG/WebP a sus carpetas. La pantalla los rotará automáticamente.
*/

const API_KEY = typeof CONFIG !== 'undefined' ? CONFIG.apiKey : '';
const VIDEOS_FOLDER = typeof CONFIG !== 'undefined' ? CONFIG.videosFolderId : '';

document.getElementById("instagram").href=CONFIG.instagramUrl;
document.getElementById("instagram").textContent="Instagram: "+CONFIG.instagramLabel;
document.getElementById("website").href=CONFIG.websiteUrl;
document.getElementById("website").textContent=CONFIG.websiteLabel;

async function listDrive(folderId, mimeQuery){
  if(!CONFIG.googleApiKey.startsWith("AIza") || folderId.startsWith("ID_")) return [];
  const q=`'${folderId}' in parents and trashed=false and (${mimeQuery})`;
  const url=new URL("https://www.googleapis.com/drive/v3/files");
  url.search=new URLSearchParams({q, key:CONFIG.googleApiKey, fields:"files(id,name,mimeType,thumbnailLink)", pageSize:"100", orderBy:"name"});
  const response=await fetch(url);
  if(!response.ok) throw new Error("Drive API: "+response.status);
  return (await response.json()).files||[];
}
function drivePreview(id){return `https://drive.google.com/file/d/${id}/preview?autoplay=1&mute=1`;}
function driveImage(id){return `https://lh3.googleusercontent.com/d/${id}`;}
function showVideos(files){
  const stage=document.getElementById("videoStage");
  if(!files.length){stage.innerHTML='<div class="empty">Añade vídeos MP4 a la carpeta configurada en Drive.<br><small>El carrusel aparecerá aquí.</small></div>';return;}
  let index=0;
  const render=()=>{stage.innerHTML=`<iframe src="${drivePreview(files[index].id)}" allow="autoplay; encrypted-media" allowfullscreen title="${files[index].name.replaceAll('"','')}"></iframe>`;};
  render();setInterval(()=>{index=(index+1)%files.length;render();},CONFIG.videoSeconds*1000);
}
function showImages(files, stageId){
  const stage=document.getElementById(stageId);
  if(!files.length){stage.innerHTML='<div class="empty-side">Añade imágenes a la carpeta de Drive configurada.</div>';return;}
  let index=0;
  const render=()=>{stage.innerHTML=`<img src="${driveImage(files[index].id)}" alt="${files[index].name.replaceAll('"','')}"><div class="caption">${files[index].name.replace(/\.[^.]+$/,"")}</div>`;};
  render();setInterval(()=>{index=(index+1)%files.length;render();},CONFIG.imageSeconds*1000);
}
(async()=>{
 try{
  const [videos,news,promos]=await Promise.all([
   listDrive(CONFIG.videosFolderId,"mimeType='video/mp4'"),
   listDrive(CONFIG.newsFolderId,"mimeType contains 'image/'"),
   listDrive(CONFIG.promoFolderId,"mimeType contains 'image/'")
  ]);
  showVideos(videos);showImages(news,"newsStage");showImages(promos,"promoStage");
 }catch(e){console.error(e);document.querySelectorAll(".carousel-stage,.video-stage").forEach(el=>el.innerHTML='<div class="empty-side">No se pudo cargar Drive. Revisa la API key, los IDs y los permisos públicos.</div>');}
})();
</script>
</body>
</html>
