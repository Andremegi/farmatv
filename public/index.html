<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmacia Barceló | Pantalla</title>
<style>
:root{--green:#A895C6;--mint:#F5F1ED;--ink:#8871AA;--cream:#fbfcf8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:Montserrat,Helvetica,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column}
header{height:12vh;min-height:78px;background:var(--green);color:#FBF9F6;display:flex;align-items:center;justify-content:space-between;padding:0 3.2vw;gap:2vw}
.brand{font-size:3vw;font-size:clamp(25px,3vw,48px);font-weight:800;letter-spacing:.04em}.links{font-size:1.4vw;font-size:clamp(13px,1.4vw,22px);text-align:right;line-height:1.5}.links a{color:#F5F1ED;text-decoration:none}
main{height:88vh;padding:2.1vh 2vw;display:grid;grid-template-columns:1fr 1.65fr;gap:1.5vw}
.panel{background:#FBF9F6;border:1px solid #F5F1ED;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #F5F1ED;min-height:0}
.video-panel{display:flex;flex-direction:column}.section-title{background:var(--mint);padding:1.2vh 1.2vw;font-size:1.6vw;font-size:clamp(17px,1.6vw,26px);font-weight:700;color:var(--green)}
.video-stage{flex:1;min-height:0;background:#81788B;display:flex;align-items:center;justify-content:center;position:relative}
.video-stage iframe{width:100%;height:100%;border:0}.video-stage .empty{color:#FBF9F6;text-align:center;padding:30px;font-size:2vw;font-size:clamp(18px,2vw,30px)}
.side{display:grid;grid-template-rows:1fr 1fr;gap:1.5vh;min-height:0}.carousel-panel{display:flex;flex-direction:column;min-height:0}
.carousel-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#F5F1ED}
.carousel-stage img{width:100%;height:100%;object-fit:contain;padding:1vh 1vw}
.caption{position:absolute;bottom:0;left:0;right:0;background:#C2B2D8;color:#FBF9F6;padding:10px 14px;font-size:1.2vw;font-size:clamp(12px,1.2vw,18px);text-align:center}
.empty-side{padding:20px;text-align:center;color:#78619B;font-size:1.3vw;font-size:clamp(14px,1.3vw,20px)}
@media(max-aspect-ratio:4/3){main{grid-template-columns:1fr 1.3fr}.brand{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="brand">FARMACIA BARCELÓ</div>
  <div class="links"><a id="instagram" href="https://www.instagram.com/farmaciabarcelomadrid" target="_blank">Instagram:@farmaciabarcelomadrid</a><br><a id="website" href="https://farmaciabarcelo.es" target="_blank">farmaciabarcelo.es</a></div>
</header>
<main>
  <div class="side">
    <section class="panel carousel-panel">
      <div class="section-title">Novedades</div>
      <div class="carousel-stage" id="newsStage"><div class="empty-side">Las imágenes de novedades aparecerán aquí</div></div>
    </section>
    <section class="panel carousel-panel">
      <div class="section-title">Promociones y productos destacados</div>
      <div class="carousel-stage" id="promoStage"><div class="empty-side">Las imágenes de promociones aparecerán aquí</div></div>
    </section>
  </div>
  <section class="panel video-panel">
    <div class="section-title">Vídeos de salud y farmacia</div>
    <div class="video-stage" id="videoStage"><div class="empty">Los vídeos aparecerán aquí</div></div>
  </section>
</main>
<script>
// MODO DIAGNÓSTICO: abrir la web con ?debug=1 para ver en pantalla
// el navegador de la TV y cualquier error (las TVs no tienen consola).
(function () {
  if (location.search.indexOf("debug=1") === -1) return;
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;" +
    "background:rgba(0,0,0,.85);color:#0f0;font:14px monospace;padding:10px;z-index:9999;white-space:pre-wrap";
  function log(msg) { box.appendChild(document.createTextNode(msg + "\n")); }
  log("Navegador: " + navigator.userAgent);
  log("Cache API: " + ("caches" in window) + " | fetch: " + ("fetch" in window));
  var v = document.createElement("video");
  log("H.264 MP4: " + (v.canPlayType('video/mp4; codecs="avc1.42E01E"') || "no"));
  window.onerror = function (m, src, line) { log("ERROR: " + m + " (línea " + line + ")"); };
  window.addEventListener("unhandledrejection", function (e) { log("ERROR promesa: " + e.reason); });
  ["error", "warn"].forEach(function (k) {
    var orig = console[k];
    console[k] = function () {
      log(k.toUpperCase() + ": " + Array.prototype.join.call(arguments, " "));
      orig.apply(console, arguments);
    };
  });
  document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(box); });
  if (document.body) document.body.appendChild(box);
})();
</script>
<script>
// Compatibilidad con navegadores antiguos de Smart TV (Chrome < 86)
if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function () {
    while (this.firstChild) this.removeChild(this.firstChild);
    for (var i = 0; i < arguments.length; i++) this.appendChild(arguments[i]);
  };
}
const CONFIG = {
  instagramUrl: "https://www.instagram.com/farmaciabarcelomadrid/",
  instagramLabel: "@farmaciabarcelomadrid",
  websiteUrl: "https://farmaciabarcelo.es",
  websiteLabel: "farmaciabarcelo.es",
  pauseBetweenVideos: 30,   // segundos de pausa entre un vídeo y el siguiente
  imageSeconds: 8
};

// Dirección de nuestra función de Netlify
const DRIVE_ENDPOINT = "/.netlify/functions/drive";

// Configurar enlaces
document.getElementById("instagram").href = CONFIG.instagramUrl;
document.getElementById("instagram").textContent =
  "Instagram: " + CONFIG.instagramLabel;

document.getElementById("website").href = CONFIG.websiteUrl;
document.getElementById("website").textContent =
  CONFIG.websiteLabel;


// CONSULTAR GOOGLE DRIVE A TRAVÉS DE NETLIFY

async function listDrive(folder) {

  const response = await fetch(
    `${DRIVE_ENDPOINT}?folder=${encodeURIComponent(folder)}`
  );

  if (!response.ok) {
    throw new Error("Error consultando Drive: " + response.status);
  }

  const data = await response.json();

  return data.files || [];
}


// VÍDEOS PUBLICADOS EN NETLIFY
// (los copia desde Drive el build: scripts/sync-videos.mjs)
async function listLocalVideos() {
  const response = await fetch("/videos/list.json", { cache: "no-store" });
  if (!response.ok) {
    throw new Error("No se encontró /videos/list.json: " + response.status);
  }
  const data = await response.json();
  return data.files || [];
}


// MOSTRAR VÍDEOS


function showVideos(files) {
  const stage = document.getElementById("videoStage");

  if (!files.length) {
    stage.innerHTML = `
      <div class="empty">
        Añade vídeos MP4 a la carpeta configurada en Drive.
        <br><small>El carrusel aparecerá aquí.</small>
      </div>`;
    return;
  }

  // ---------------------------------------------------------------
  // CACHÉ LOCAL: cada vídeo se descarga UNA vez y se guarda en el
  // navegador, para no gastar ancho de banda de Netlify en cada vuelta.
  // ---------------------------------------------------------------
  const CACHE_NAME = "farmatv-videos-v2";   // v2: vídeos convertidos a H.264
  const cacheKey = f => `/video-cache/${f.id}`;
  // Las Smart TV (Samsung Tizen, LG webOS) pasan el vídeo a su reproductor
  // nativo, que no abre URLs "blob:" (copias locales). En ellas se
  // reproduce directamente desde Netlify.
  const isSmartTV = /SMART-TV|Tizen|Web0S|webOS|SmartTV/i.test(navigator.userAgent);
  const hasCache = "caches" in window && !isSmartTV;

  const ready = [];          // vídeos listos para reproducir, en orden
  const localUrls = {};      // id -> URL local (blob) del vídeo guardado
  let index = 0;
  let started = false;

  // ESTADO DEL REPRODUCTOR: solo hay UN temporizador para pasar al
  // siguiente vídeo, así nada puede cambiar el vídeo dos veces a la vez.
  //   "playing" -> reproduciendo (o cargando) el vídeo actual
  //   "pausing" -> vídeo terminado, esperando la pausa entre vídeos
  let state = "playing";
  let advanceTimer = null;
  let lastTime = -1;
  let stuckSeconds = 0;

  const video = document.createElement("video");
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.controls = false;
  video.loop = false;
  video.preload = "auto";
  video.setAttribute("muted", "");
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.style.width = "100%";
  video.style.height = "100%";
  video.style.objectFit = "contain";
  video.style.background = "#000";

  // Aviso para cuando la TV bloquea el autoplay (p. ej. Samsung Internet)
  const startHint = document.createElement("div");
  startHint.textContent = "Pulsa OK en el mando para empezar";
  startHint.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);" +
    "background:rgba(0,0,0,.75);color:#fff;padding:18px 28px;border-radius:12px;" +
    "font-size:24px;font-weight:700;text-align:center;display:none";
  stage.style.position = "relative";
  stage.innerHTML = `<div class="empty">Cargando vídeos…</div>`;

  const tryPlay = () => {
    const p = video.play();
    if (p && p.then) {
      p.then(() => { startHint.style.display = "none"; })
       .catch(error => {
        if (error && error.name === "AbortError") return; // se cambió de vídeo, normal
        console.error("Autoplay bloqueado o error:", error);
        if (error && error.name === "NotAllowedError") {
          startHint.style.display = "block";
        }
      });
    }
  };

  // Cargar y reproducir el vídeo actual (síncrono: sin esperas intermedias)
  const play = () => {
    if (!ready.length) return;
    index = index % ready.length;
    const file = ready[index];
    state = "playing";
    lastTime = -1;
    stuckSeconds = 0;
    video.src = localUrls[file.id] || file.src;
    video.load();
    tryPlay();
  };

  // Programar el paso al siguiente vídeo (cancela cualquier otro programado)
  const scheduleNext = ms => {
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => {
      advanceTimer = null;
      index = (index + 1) % ready.length;
      play();
    }, ms);
  };

  // Un botón del mando / clic: solo arranca si el vídeo está parado a mitad
  window.startVideoPlayback = () => {
    if (state === "playing" && video.paused && !video.ended) tryPlay();
  };

  const addReady = file => {
    ready.push(file);
    if (!started) {
      started = true;
      stage.replaceChildren(video, startHint);
      play();
    }
  };

  // Al terminar: se queda en la última imagen durante la pausa y luego pasa al siguiente
  video.addEventListener("ended", () => {
    if (state !== "playing") return;
    state = "pausing";
    scheduleNext(CONFIG.pauseBetweenVideos * 1000);
  });

  video.addEventListener("error", () => {
    if (state !== "playing" || !video.getAttribute("src")) return;
    console.error("Error cargando vídeo:", ready[index] && ready[index].name, video.error);
    const file = ready[index];
    // Si falló la copia local, la próxima vez usar la de Netlify
    if (file && localUrls[file.id] && video.src === localUrls[file.id]) {
      delete localUrls[file.id];
    }
    state = "pausing";
    scheduleNext(3000);
  });

  // Vigilante (solo mientras se reproduce): reanuda si se pausó solo y
  // salta al siguiente si el vídeo no avanza en 20 s
  setInterval(() => {
    if (!started || state !== "playing" || video.ended) return;
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      stuckSeconds = 0;
      return;
    }
    stuckSeconds += 5;
    if (video.paused) tryPlay();
    if (stuckSeconds >= 20) {
      console.warn("Vídeo atascado, saltando:", ready[index] && ready[index].name);
      state = "pausing";
      scheduleNext(0);
    }
  }, 5000);

  // Crear la URL local de un vídeo guardado (una sola vez por vídeo)
  const makeLocalUrl = async (cache, file) => {
    try {
      const res = await cache.match(cacheKey(file));
      if (res) localUrls[file.id] = URL.createObjectURL(await res.blob());
    } catch (error) {
      console.warn("No se pudo usar la copia guardada:", file.name, error);
    }
  };

  const download = async (cache, file) => {
    try {
      const res = await fetch(file.src);
      const type = res.headers.get("content-type") || "";
      if (!res.ok || !type.startsWith("video/")) {
        console.warn("No se pudo descargar el vídeo:", file.name, res.status, type);
        return;
      }
      await cache.put(cacheKey(file), res);
    } catch (error) {
      console.warn("Fallo guardando vídeo:", file.name, error);
    }
  };

  const loadAll = async () => {
    if (!hasCache) {
      files.forEach(addReady);   // sin caché: reproducir directo desde Netlify
      return;
    }

    // Borrar cachés de versiones anteriores
    for (const name of await caches.keys()) {
      if (name !== CACHE_NAME) await caches.delete(name);
    }
    const cache = await caches.open(CACHE_NAME);

    // Borrar vídeos guardados que ya no están en la lista
    const wanted = new Set(files.map(f => cacheKey(f)));
    for (const req of await cache.keys()) {
      if (!wanted.has(new URL(req.url).pathname)) await cache.delete(req);
    }

    // En orden: si no está guardado se descarga; si no se puede guardar
    // (poco espacio en la TV), se reproduce igualmente desde Netlify
    for (const file of files) {
      if (!(await cache.match(cacheKey(file)))) await download(cache, file);
      await makeLocalUrl(cache, file);
      addReady(file);
    }
  };

  loadAll().catch(error => {
    console.error("Error preparando vídeos:", error);
    files.forEach(f => { if (ready.indexOf(f) === -1) addReady(f); });
  });
}

// PANTALLA COMPLETA
// Los navegadores solo permiten pantalla completa tras una interacción:
// basta con pulsar cualquier botón del mando/teclado o hacer clic una vez.
function goFullscreen() {
  if (window.startVideoPlayback) window.startVideoPlayback();
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) {
    Promise.resolve(req.call(el)).catch(err =>
      console.warn("No se pudo activar pantalla completa:", err)
    );
  }
}
["click", "keydown", "touchstart"].forEach(evt =>
  document.addEventListener(evt, goFullscreen)
);

// Ocultar el cursor del ratón
document.documentElement.style.cursor = "none";

// Recargar la página cada hora: actualiza la lista de Drive y
// recupera la pantalla ante cualquier fallo inesperado
// (Si la pantalla completa se activó con un clic, recargar la quitaría,
// así que en ese caso no se recarga. Con el modo kiosco/F11 sí se recarga.)
setTimeout(() => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    location.reload();
  }
}, 60 * 60 * 1000);


// MOSTRAR IMÁGENES

function showImages(files, stageId) {

  const stage = document.getElementById(stageId);

  if (!files.length) {
    stage.innerHTML = `
      <div class="empty-side">
        Añade imágenes a la carpeta de Drive configurada.
      </div>`;
    return;
  }

  let index = 0;

  const render = () => {

    const img = document.createElement("img");

    img.src =
      `https://lh3.googleusercontent.com/d/${files[index].id}`;

    img.alt = files[index].name;

    const caption = document.createElement("div");

    caption.className = "caption";

    caption.textContent = files[index].name.replace(/\.[^.]+$/, "");

    stage.replaceChildren(img, caption);
  };

  render();

  setInterval(() => {
    index = (index + 1) % files.length;
    render();
  }, CONFIG.imageSeconds * 1000);
}


// INICIAR LA PANTALLA

(async () => {

  try {

    const [videos, news, promos] = await Promise.all([

      listLocalVideos(),

      listDrive("news"),

      listDrive("promos")

    ]);

    showVideos(videos);

    showImages(news, "newsStage");

    showImages(promos, "promoStage");

  } catch (error) {

    console.error("Error cargando contenido:", error);

    document.querySelectorAll(
      ".carousel-stage, .video-stage"
    ).forEach(stage => {

      stage.innerHTML = `
        <div class="empty-side">
          No se pudo cargar el contenido.
          Comprueba la conexión con Google Drive.
        </div>`;

    });

  }

})();
</script>
</body>
</html>
