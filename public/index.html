<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmacia Barceló | Pantalla</title>
<style>
:root{--green:#A895C6;--mint:#F5F1ED;--ink:#8871AA;--cream:#fbfcf8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:Montserrat,Helvetica,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column}
header{height:12vh;min-height:78px;background:var(--green);color:#FBF9F6;display:flex;align-items:center;justify-content:space-between;padding:0 3.2vw;gap:2vw}
.brand{font-size:3vw;font-size:clamp(25px,3vw,48px);font-weight:800;letter-spacing:.04em}.links{font-size:1.4vw;font-size:clamp(13px,1.4vw,22px);text-align:right;line-height:1.5}.links a{color:#F5F1ED;text-decoration:none}
main{height:88vh;padding:2.1vh 2vw;display:grid;grid-template-columns:1.65fr 1fr;gap:1.5vw}
.panel{background:#FBF9F6;border:1px solid #F5F1ED;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #F5F1ED;min-height:0}
.video-panel{display:flex;flex-direction:column}.section-title{background:var(--mint);padding:1.2vh 1.2vw;font-size:1.6vw;font-size:clamp(17px,1.6vw,26px);font-weight:700;color:var(--green)}
.video-stage{flex:1;min-height:0;background:#81788B;display:flex;align-items:center;justify-content:center;position:relative}
.video-stage iframe{width:100%;height:100%;border:0}.video-stage .empty{color:#FBF9F6;text-align:center;padding:30px;font-size:2vw;font-size:clamp(18px,2vw,30px)}
.side{display:grid;grid-template-rows:1fr 1fr;gap:1.5vh;min-height:0}.carousel-panel{display:flex;flex-direction:column;min-height:0}
.carousel-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#F5F1ED}
.carousel-stage img{width:100%;height:100%;object-fit:contain;padding:1vh 1vw}
.caption{position:absolute;bottom:0;left:0;right:0;background:#C2B2D8;color:#FBF9F6;padding:10px 14px;font-size:1.2vw;font-size:clamp(12px,1.2vw,18px);text-align:center}
.empty-side{padding:20px;text-align:center;color:#78619B;font-size:1.3vw;font-size:clamp(14px,1.3vw,20px)}
@media(max-aspect-ratio:4/3){main{grid-template-columns:1.3fr 1fr}.brand{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="brand">FARMACIA BARCELÓ</div>
  <div class="links"><a id="instagram" href="https://www.instagram.com/farmaciabarcelomadrid" target="_blank">Instagram:@farmaciabarcelomadrid</a><br><a id="website" href="https://farmaciabarcelo.es" target="_blank">farmaciabarcelo.es</a></div>
</header>
<main>
  <section class="panel video-panel">
    <div class="section-title">Vídeos de salud y farmacia</div>
    <div class="video-stage" id="videoStage"><div class="empty">Los vídeos aparecerán aquí</div></div>
  </section>
  <div class="side">
    <section class="panel carousel-panel">
      <div class="section-title">Novedades</div>
      <div class="carousel-stage" id="newsStage"><div class="empty-side">Las imágenes de novedades aparecerán aquí</div></div>
    </section>
    <section class="panel carousel-panel">
      <div class="section-title">Promociones y productos destacados</div>
      <div class="carousel-stage" id="promoStage"><div class="empty-side">Las imágenes de promociones aparecerán aquí</div></div>
    </section>
  </div>
</main>
<script>
// Compatibilidad con navegadores antiguos de Smart TV (Chrome < 86)
if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function () {
    while (this.firstChild) this.removeChild(this.firstChild);
    for (var i = 0; i < arguments.length; i++) this.appendChild(arguments[i]);
  };
}
const CONFIG = {
  instagramUrl: "https://www.instagram.com/farmaciabarcelomadrid/",
  instagramLabel: "@farmaciabarcelomadrid",
  websiteUrl: "https://farmaciabarcelo.es",
  websiteLabel: "farmaciabarcelo.es",
  videoSeconds: 30,
  imageSeconds: 8
};

// Dirección de nuestra función de Netlify
const DRIVE_ENDPOINT = "/.netlify/functions/drive";

// Configurar enlaces
document.getElementById("instagram").href = CONFIG.instagramUrl;
document.getElementById("instagram").textContent =
  "Instagram: " + CONFIG.instagramLabel;

document.getElementById("website").href = CONFIG.websiteUrl;
document.getElementById("website").textContent =
  CONFIG.websiteLabel;


// CONSULTAR GOOGLE DRIVE A TRAVÉS DE NETLIFY

async function listDrive(folder) {

  const response = await fetch(
    `${DRIVE_ENDPOINT}?folder=${encodeURIComponent(folder)}`
  );

  if (!response.ok) {
    throw new Error("Error consultando Drive: " + response.status);
  }

  const data = await response.json();

  return data.files || [];
}


// VÍDEOS PUBLICADOS EN NETLIFY
// (los copia desde Drive el build: scripts/sync-videos.mjs)
async function listLocalVideos() {
  const response = await fetch("/videos/list.json", { cache: "no-store" });
  if (!response.ok) {
    throw new Error("No se encontró /videos/list.json: " + response.status);
  }
  const data = await response.json();
  return data.files || [];
}


// MOSTRAR VÍDEOS


function showVideos(files) {
  const stage = document.getElementById("videoStage");

  if (!files.length) {
    stage.innerHTML = `
      <div class="empty">
        Añade vídeos MP4 a la carpeta configurada en Drive.
        <br><small>El carrusel aparecerá aquí.</small>
      </div>`;
    return;
  }

  // ---------------------------------------------------------------
  // CACHÉ LOCAL: cada vídeo se descarga de Drive UNA sola vez y se
  // guarda en el navegador. Así Google no nos bloquea por "consultas
  // automatizadas" al repetir descargas en cada vuelta del bucle.
  // ---------------------------------------------------------------
  const CACHE_NAME = "farmatv-videos-v1";
  const RETRY_MINUTES = 30;          // reintento si Google bloquea/falla
  const cacheKey = f => `/video-cache/${f.id}`;
  const hasCache = "caches" in window;

  const ready = [];                  // vídeos ya guardados, listos para reproducir
  let index = 0;
  let lastTime = -1;
  let stuckSeconds = 0;
  let currentUrl = null;
  let started = false;

  const video = document.createElement("video");
  video.autoplay = true;
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.controls = false;
  video.preload = "auto";
  video.style.width = "100%";
  video.style.height = "100%";
  video.style.objectFit = "contain";
  video.style.background = "#000";

  stage.innerHTML = `<div class="empty">Cargando vídeos…</div>`;

  const play = async () => {
    if (!ready.length) return;
    index = index % ready.length;
    const file = ready[index];
    lastTime = -1;
    stuckSeconds = 0;
    video.loop = ready.length === 1;

    let src = file.src;
    if (hasCache) {
      const cache = await caches.open(CACHE_NAME);
      const res = await cache.match(cacheKey(file));
      if (res) {
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(await res.blob());
        src = currentUrl;
      }
    }
    video.src = src;
    video.load();
    video.play().catch(error => {
      console.error("Autoplay bloqueado o error:", error);
    });
  };

  const next = () => {
    index = (index + 1) % Math.max(ready.length, 1);
    play();
  };

  const addReady = file => {
    ready.push(file);
    if (!started) {
      started = true;
      stage.replaceChildren(video);
      play();
    } else {
      video.loop = ready.length === 1;
    }
  };

  video.addEventListener("ended", next);

  video.addEventListener("error", () => {
    console.error("Error cargando vídeo:", ready[index] && ready[index].name, video.error);
    setTimeout(next, 3000);
  });

  // Vigilante: si el vídeo no avanza durante 20 s, saltar al siguiente
  setInterval(() => {
    if (!started) return;
    if (video.currentTime === lastTime) {
      stuckSeconds += 5;
      if (video.paused) video.play().catch(() => {});
      if (stuckSeconds >= 20) {
        console.warn("Vídeo atascado, saltando:", ready[index] && ready[index].name);
        next();
      }
    } else {
      lastTime = video.currentTime;
      stuckSeconds = 0;
    }
  }, 5000);

  // Descarga un vídeo y lo guarda. Devuelve true si quedó guardado.
  const download = async (cache, file) => {
    try {
      const res = await fetch(file.src);
      const type = res.headers.get("content-type") || "";
      if (!res.ok || !type.startsWith("video/")) {
        console.warn("Drive no devolvió el vídeo:", file.name, res.status, type);
        return false;
      }
      await cache.put(cacheKey(file), res);
      return true;
    } catch (error) {
      console.warn("Fallo descargando vídeo:", file.name, error);
      return false;
    }
  };

  const loadAll = async () => {
    // Sin Cache API: reproducir directamente desde Drive (comportamiento antiguo)
    if (!hasCache) {
      files.forEach(addReady);
      return;
    }

    const cache = await caches.open(CACHE_NAME);

    // Borrar vídeos guardados que ya no están en la carpeta de Drive
    const wanted = new Set(files.map(f => cacheKey(f)));
    for (const req of await cache.keys()) {
      if (!wanted.has(new URL(req.url).pathname)) await cache.delete(req);
    }

    // Primero los que ya estaban guardados (no tocan Drive)
    const pending = [];
    for (const file of files) {
      if (await cache.match(cacheKey(file))) addReady(file);
      else pending.push(file);
    }

    // Luego descargar los nuevos, de uno en uno
    const failed = [];
    // Si no se puede guardar (p. ej. poco espacio en la TV), se reproduce
    // igualmente en streaming directo desde Netlify
    for (const file of pending) {
      await download(cache, file);
      addReady(file);
    }

    // Reintentar los que fallaron cada RETRY_MINUTES hasta conseguirlo
    const retry = async list => {
      if (!list.length) return;
      if (!started) {
        stage.innerHTML = `<div class="empty">No se pudieron descargar los vídeos.<br>
          <small>Se reintentará en ${RETRY_MINUTES} minutos.</small></div>`;
      }
      setTimeout(async () => {
        const stillFailed = [];
        for (const file of list) {
          if (await download(cache, file)) addReady(file);
          else stillFailed.push(file);
        }
        retry(stillFailed);
      }, RETRY_MINUTES * 60 * 1000);
    };
    retry(failed);
  };

  loadAll().catch(error => {
    console.error("Error preparando vídeos:", error);
    files.forEach(addReady);   // último recurso: reproducir directo de Drive
  });
}

// PANTALLA COMPLETA
// Los navegadores solo permiten pantalla completa tras una interacción:
// basta con pulsar cualquier botón del mando/teclado o hacer clic una vez.
function goFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) {
    Promise.resolve(req.call(el)).catch(err =>
      console.warn("No se pudo activar pantalla completa:", err)
    );
  }
}
["click", "keydown", "touchstart"].forEach(evt =>
  document.addEventListener(evt, goFullscreen)
);

// Ocultar el cursor del ratón
document.documentElement.style.cursor = "none";

// Recargar la página cada hora: actualiza la lista de Drive y
// recupera la pantalla ante cualquier fallo inesperado
// (Si la pantalla completa se activó con un clic, recargar la quitaría,
// así que en ese caso no se recarga. Con el modo kiosco/F11 sí se recarga.)
setTimeout(() => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    location.reload();
  }
}, 60 * 60 * 1000);


// MOSTRAR IMÁGENES

function showImages(files, stageId) {

  const stage = document.getElementById(stageId);

  if (!files.length) {
    stage.innerHTML = `
      <div class="empty-side">
        Añade imágenes a la carpeta de Drive configurada.
      </div>`;
    return;
  }

  let index = 0;

  const render = () => {

    const img = document.createElement("img");

    img.src =
      `https://lh3.googleusercontent.com/d/${files[index].id}`;

    img.alt = files[index].name;

    const caption = document.createElement("div");

    caption.className = "caption";

    caption.textContent = files[index].name.replace(/\.[^.]+$/, "");

    stage.replaceChildren(img, caption);
  };

  render();

  setInterval(() => {
    index = (index + 1) % files.length;
    render();
  }, CONFIG.imageSeconds * 1000);
}


// INICIAR LA PANTALLA

(async () => {

  try {

    const [videos, news, promos] = await Promise.all([

      listLocalVideos(),

      listDrive("news"),

      listDrive("promos")

    ]);

    showVideos(videos);

    showImages(news, "newsStage");

    showImages(promos, "promoStage");

  } catch (error) {

    console.error("Error cargando contenido:", error);

    document.querySelectorAll(
      ".carousel-stage, .video-stage"
    ).forEach(stage => {

      stage.innerHTML = `
        <div class="empty-side">
          No se pudo cargar el contenido.
          Comprueba la conexión con Google Drive.
        </div>`;

    });

  }

})();
</script>
</body>
</html>
